querycedro=select nvl(fins_id,'N/A') finsid, nvl(message_rlt,'N/A') mensaje from ft_t_rlt1 rlt1 left join ft_t_fiid fiid on rlt1.rlt_field=fiid.inst_mnem and fiid.fins_id_ctxt_typ='FINSID' where rlt1.rlt_purp_typ='REPORTES' and rlt1.data_src_app='CEDRO' and rlt1.start_tms >= (select start_tms from (select job_start_tms start_tms from ft_t_jblg where job_msg_typ='CDR' and job_stat_typ='CLOSED' order by job_start_tms desc) where rownum <2) order by fins_id asc
