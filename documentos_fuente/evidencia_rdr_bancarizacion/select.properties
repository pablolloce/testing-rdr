querydifusion_cparty=select unique tab3.fins_id FINSID, tab3.mgcgloid MGCGLOID, tab3.dif_stat ESTADO_DIFUSION, NVL(utd2.utd_id,'NO MESSAGE') DESCRIPCION FROM (select tab2.*, decode(utd1.utd_id,'The current counterparty has been broadcasted with errors','NACK',NULL,'NOT BROADCASTED','ACK') dif_stat from (select fiid.fins_id, tab1.* from  ( (select fiid.fins_id mgcgloid, fiid.inst_mnem from  ft_t_fiid fiid, (select distinct (rlt_field) from  (select * from ft_t_rlt1 where rlt_dif_acc in ('A','M','B') and last_chg_tms > trunc(sysdate)) where last_chg_usr_id = 'DIFUSION_CPARTY' and rlt_dif_stat = 'OK' and data_src_app !='CLIENTELA') rlt1 where fiid.fins_id_ctxt_typ = 'MGCGLOID' and fiid.data_stat_typ = 'ACTIVE' and fiid.inst_mnem = rlt1.rlt_field) union all (select fiid.fins_id mgcgloid, fiid.inst_mnem from  ft_t_fiid fiid, ft_t_firl firl, (select distinct (rlt_field) from  (select * from ft_t_rlt1 where rlt_dif_acc in ('A','M','B') and last_chg_tms > trunc(sysdate)) where last_chg_usr_id = 'DIFUSION_CPARTY' and rlt_dif_stat = 'OK' and data_src_app ='CLIENTELA') rlt1 where  rlt1.rlt_field = firl.prnt_inst_mnem and fiid.fins_id_ctxt_typ = 'MGCGLOID' and fiid.data_stat_typ = 'ACTIVE' and fiid.inst_mnem = firl.inst_mnem) ) tab1 join ft_t_fiid fiid on tab1.inst_mnem = fiid.inst_mnem where fiid.fins_id_ctxt_typ = 'FINSID') tab2  left join (select * from ft_t_utd1 where utd_id_purp_typ = 'ACKNACK' and utd_usage_typ = 'DIFUSION' and last_chg_tms > trunc(sysdate)) utd1 on tab2.inst_mnem = utd1.assoc_inst_mnem) tab3 left join (select * from ft_t_utd1 where utd_id_purp_typ = 'DESC' and utd_usage_typ = 'DIFUSION' and last_chg_tms > trunc(sysdate)) UTD2 on tab3.inst_mnem = utd2.assoc_inst_mnem order by 3,2
cabeceradifusion_cparty=FINSID;MGCGLOID;ESTADO_DIFUSION;DESCRIPCION
fileNamedifusion_cparty=Reporte_difusion_cparty.csv

querydifusion_batch=select unique tab3.fins_id FINSID, tab3.mgcgloid MGCGLOID, tab3.dif_stat ESTADO_DIFUSION, NVL(utd2.utd_id,'NO MESSAGE') DESCRIPCION FROM (select tab2.*, decode(utd1.utd_id,'The current counterparty has been broadcasted with errors','NACK',NULL,'NOT BROADCASTED','ACK') dif_stat from (select fiid.fins_id, tab1.* from  ( (select fiid.fins_id mgcgloid, fiid.inst_mnem from  ft_t_fiid fiid, (select distinct (rlt_field) from  (select * from ft_t_rlt1 where rlt_dif_acc in ('A','M','B') and last_chg_tms > trunc(sysdate)) where last_chg_usr_id = 'DIFUSION_BATCH' and rlt_dif_stat = 'OK' and data_src_app !='CLIENTELA') rlt1 where fiid.fins_id_ctxt_typ = 'MGCGLOID' and fiid.data_stat_typ = 'ACTIVE' and fiid.inst_mnem = rlt1.rlt_field) union all (select fiid.fins_id mgcgloid, fiid.inst_mnem from  ft_t_fiid fiid, ft_t_firl firl, (select distinct (rlt_field) from  (select * from ft_t_rlt1 where rlt_dif_acc in ('A','M','B') and last_chg_tms > trunc(sysdate)) where last_chg_usr_id = 'DIFUSION_BATCH' and rlt_dif_stat = 'OK' and data_src_app ='CLIENTELA') rlt1 where  rlt1.rlt_field = firl.prnt_inst_mnem and fiid.fins_id_ctxt_typ = 'MGCGLOID' and fiid.data_stat_typ = 'ACTIVE' and fiid.inst_mnem = firl.inst_mnem) ) tab1 join ft_t_fiid fiid on tab1.inst_mnem = fiid.inst_mnem where fiid.fins_id_ctxt_typ = 'FINSID') tab2  left join (select * from ft_t_utd1 where utd_id_purp_typ = 'ACKNACK' and utd_usage_typ = 'DIFUSION' and last_chg_tms > trunc(sysdate)) utd1 on tab2.inst_mnem = utd1.assoc_inst_mnem) tab3 left join (select * from ft_t_utd1 where utd_id_purp_typ = 'DESC' and utd_usage_typ = 'DIFUSION' and last_chg_tms > trunc(sysdate)) UTD2 on tab3.inst_mnem = utd2.assoc_inst_mnem order by 3,2
cabeceradifusion_batch=FINSID;MGCGLOID;ESTADO_DIFUSION;DESCRIPCION
fileNamedifusion_batch=Reporte_difusion_batch.csv

queryoficinas=select nvl(fins_id,'N/A') finsid,nvl(src_value,'N/A') csb,nvl(gs_value,'N/A') oficina,nvl(message_rlt,'N/A') mensaje from ft_t_rlt1 rlt1, ft_t_fiid fiid where rlt1.rlt_purp_typ='REPORTES' and rlt1.data_src_app='OFICINAS' and rlt1.rlt_field=fiid.inst_mnem and fiid.fins_id_ctxt_typ='FINSID' and rlt1.rlt_status='3' and rlt1.start_tms >= (select start_tms from (select job_start_tms start_tms from ft_t_jblg where job_msg_typ='OFC' and job_stat_typ='CLOSED' order by job_start_tms desc) where rownum <2) order by gs_value asc
